services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: ${THINGSBOARD_DB_PASSWORD:?Set THINGSBOARD_DB_PASSWORD}
    volumes:
      - thingsboard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  thingsboard:
    image: thingsboard/tb-node:4.3.1.8
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "1883:1883"
      - "7070:7070"
      - "5683-5688:5683-5688/udp"
    environment:
      TB_QUEUE_TYPE: in-memory
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${THINGSBOARD_DB_PASSWORD:?Set THINGSBOARD_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  thingsboard-data:
