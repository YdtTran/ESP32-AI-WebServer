services:
  platform-bridge:
    image: iot-platform-bridge:local
    build:
      context: ./thingsboard-mcp
      dockerfile: ../platform-bridge/runtime.Dockerfile
    container_name: platform-bridge
    restart: unless-stopped
    command: ["uvicorn", "platform-bridge.app:app", "--host", "0.0.0.0", "--port", "8005"]
    ports:
      - "8005:8005"
    volumes:
      - ./platform-bridge:/app/platform-bridge
      - ./thingsboard-mcp:/app/thingsboard-mcp:ro
      - ./deploy/platform-data:/app/data
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - CONSOLE_USERNAME=${CONSOLE_USERNAME:-}
      - CONSOLE_PASSWORD=${CONSOLE_PASSWORD:-}
      - WHISPER_URL=http://faster-whisper:8000/v1/audio/transcriptions
      - PIPER_URL=http://piper-tts:10200/v1/audio/speech
      - LLM_GATEWAY_URL=http://mcp-gateway:8008/v1
      - BRIDGE_SECRET=${BRIDGE_SECRET:?Set BRIDGE_SECRET}
      - WS_PUBLIC_PORT=8005
      - PUBLIC_WS_URL=${PUBLIC_WS_URL:-ws://${HOST_IP:-192.168.1.7}:8005/xiaozhi/v1/}
      - PUBLIC_OTA_URL=${PUBLIC_OTA_URL:-http://${HOST_IP:-192.168.1.7}:8005/xiaozhi/ota/}
      - HOST_IP=${HOST_IP:-192.168.1.7}
      - THINGSBOARD_HOST=${THINGSBOARD_HOST:-http://172.18.0.1:8080}
      - THINGSBOARD_ALLOWED_ORIGINS=${THINGSBOARD_ALLOWED_ORIGINS:-http://172.18.0.1:8080}
      - THINGSBOARD_API_KEY=${THINGSBOARD_API_KEY:-}
    networks:
      - default

  xiaozhi-server:
    image: iot-xiaozhi-baseline:local
    build:
      context: ./deploy/xiaozhi-runtime
    container_name: xiaozhi-server
    restart: unless-stopped
    command: ["python", "app.py"]
    ports:
      - "8003:8003"
    volumes:
      - ./deploy/xiaozhi-data:/app/data
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - WHISPER_URL=http://faster-whisper:8000/v1/audio/transcriptions
      - PIPER_URL=http://piper-tts:10200/v1/audio/speech
      - LLM_URL=http://mcp-gateway:8008/v1
      - BRIDGE_SECRET=${BRIDGE_SECRET:?Set BRIDGE_SECRET}
      - HOST_LAN_IP=${HOST_IP:-192.168.1.7}
      - THINGSBOARD_URL=${THINGSBOARD_HOST:-http://172.18.0.1:8080}
    depends_on:
      - platform-bridge
    networks:
      - default

networks:
  default:
    name: iot_assignment_default
    external: true
