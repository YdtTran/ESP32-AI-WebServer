services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_FLASH_ATTENTION=1
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  faster-whisper:
    build:
      context: ./faster-whisper
      dockerfile: Dockerfile.cpu
    container_name: faster-whisper
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=small
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_DEVICE=cpu
      - WHISPER_CPU_THREADS=4
      - WHISPER_LANGUAGE=vi
      - WHISPER_VAD_FILTER=true
      - WHISPER_MODEL_DIR=/models
    volumes:
      - ./whisper-models:/models

  piper-tts:
    build:
      context: ./piper/src/python_run
      dockerfile: Dockerfile
    container_name: piper-tts
    restart: unless-stopped
    ports:
      - "10200:10200"
    environment:
      - PIPER_MODEL_DIR=/models
      - PIPER_DEFAULT_VOICE=vi_VN-vais1000-medium
      - PIPER_INTRA_THREADS=4
    volumes:
      - ./piper-models:/models

  mcp-gateway:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: mcp-gateway
    restart: unless-stopped
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PORT=8008
      - API_KEY=${API_KEY:?Set API_KEY in .env}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b-instruct
      - COREIOT_URL=${COREIOT_URL:-}
      - COREIOT_PUBLIC_ID=${COREIOT_PUBLIC_ID:-}
      - COREIOT_DASHBOARD_ID=${COREIOT_DASHBOARD_ID:-}
      - COREIOT_USERNAME=${COREIOT_USERNAME:-}
      - COREIOT_PASSWORD=${COREIOT_PASSWORD:-}
      - COREIOT_DEVICE_TOKEN=${COREIOT_DEVICE_TOKEN:-}
      - MCP_ENDPOINT=${MCP_ENDPOINT:-}
    depends_on:
      - ollama

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    restart: unless-stopped
    environment:
      - API_KEY=${API_KEY:?Set API_KEY in .env}
      - WHISPER_URL=http://faster-whisper:8000
      - PIPER_URL=http://piper-tts:10200
      - OLLAMA_URL=http://ollama:11434
      - MCP_GATEWAY_URL=http://mcp-gateway:8008
    depends_on:
      - ollama
      - faster-whisper
      - piper-tts
      - mcp-gateway

volumes:
  ollama-data:
